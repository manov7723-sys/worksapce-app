version: "3.8"
services:
  app:
    build: .
    expose:
      - "80"          # internal only, no host port needed
    networks:
      - crew-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"       # only nginx is public-facing
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - crew-net

networks:
  crew-net:
    driver: bridge