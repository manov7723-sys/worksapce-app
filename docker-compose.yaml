version: "3.8"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    networks:
      - crew-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - crew-net

networks:
  crew-net: